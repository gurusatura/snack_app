name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    name: Backend Pytest Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: snack_overflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/snack_overflow_test
      DIRECT_URL: postgresql://postgres:postgrespassword@localhost:5432/snack_overflow_test
      JWT_SECRET: ci_test_secret_for_github_actions_32bytes_long
      JWT_EXPIRE_MINUTES: 1440
      CORS_ORIGIN: http://localhost:3000
      SEED_ADMIN_EMAIL: admin@snackoverflow.local
      SEED_ADMIN_PASSWORD: AdminPassword123!
      SEED_MEMBER1_EMAIL: member1@snackoverflow.local
      SEED_MEMBER1_PASSWORD: Member1Password123!
      SEED_MEMBER2_EMAIL: member2@snackoverflow.local
      SEED_MEMBER2_PASSWORD: Member2Password123!

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Alembic migrations
        run: |
          cd backend
          alembic upgrade head

      - name: Seed database with canonical data
        run: |
          cd backend
          python seed.py

      - name: Run pytest test suite
        run: |
          cd backend
          pytest -v

  frontend-build:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Next.js production bundle
        run: |
          cd frontend
          npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
